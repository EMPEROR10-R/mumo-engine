[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mumo-engine"
version = "1.1.0-alpha.2"
description = "Boundary-based statistics and risk-corridor calculations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mumo Framework Authors" },
]
keywords = ["statistics", "risk", "boundaries", "mumo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["mumo_framework", "mumo_gui"]

[project.scripts]
mumo-framework = "mumo_framework:main"
mumo-framework-gui = "mumo_gui:main"